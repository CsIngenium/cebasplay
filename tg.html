<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descarga Gratis</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333;
        }

        /* 1. Encabezado Rojo */
        .hero-section {
            background: linear-gradient(135deg, #d32f2f, #9a0007);
            color: #ffffff;
            text-align: center;
            padding: 50px 20px 40px;
        }

        .hero-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .tagline {
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1.5px;
            font-size: 0.9rem;
            background-color: rgba(255, 255, 255, 0.2);
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 15px;
        }

        .hero-title {
            font-size: 3rem;
            line-height: 1.2;
            margin-bottom: 15px;
            font-weight: 800;
        }

        .hero-subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        /* 2. Sección Blanca pegada justo debajo */
        .form-section {
            background-color: #ffffff;
            padding: 20px 20px 60px 20px; /* Mínima separación con el header */
            margin-top: 0; /* Totalmente pegado */
            width: 100%;
        }

        .form-container {
            max-width: 480px;
            margin: 0 auto; /* Centrado horizontal del contenido */
            text-align: center;
        }

        .form-title {
            font-size: 0.9rem;
            color: #444;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .lead-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-email {
            width: 100%;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .input-email:focus {
            border-color: #d32f2f;
        }

        .btn-submit {
            background-color: #d32f2f;
            color: #ffffff;
            border: none;
            padding: 15px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-submit:hover {
            background-color: #b71c1c;
        }

        .privacy-note {
            font-size: 0.8rem;
            color: #777;
            margin-top: 12px;
        }

        @media (max-width: 600px) {
            .hero-title {
                font-size: 1.8rem;
            }
            .hero-subtitle {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Encabezado Rojo -->
    <header class="hero-section">
        <div class="hero-container">
            <span class="tagline">🎁 Recurso Gratuito</span>
            <h1 class="hero-title">Obten tu Skin del Tio Gilipollas para los Sims 1</h1>
            <p class="hero-subtitle">¡GRATIS!</p>
        </div>
    </header>

    <!-- Sección Blanca directamente debajo -->
    <section class="form-section">
        <div class="form-container">
            
            <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSf26FWvfcUXqnZR4Nz-8b1ICX9a8cj4hBNWFx6KIaKGGbab3g/viewform?embedded=true" width="640" height="453" frameborder="0" marginheight="0" marginwidth="0">Cargando…</iframe>

            <p class="privacy-note">🔒 Cero Spam. Respetamos tu privacidad y puedes darte de baja cuando quieras.</p>
        </div>
    </section>

</body>
</html>
